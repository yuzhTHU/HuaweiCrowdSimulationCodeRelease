<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>行人模拟可视化</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>行人/车辆 模拟可视化</h1>
    </header>

    <section id="controls">
      <div class="row">
        <label>数据集路径: <input id="dataset_path" value="./data/..." /></label>
        <button id="btn_load_dataset">加载数据集</button>
        <span id="dataset_info"></span>
      </div>
      <div class="row">
        <label>Checkpoint 路径: <input id="checkpoint_path" value="./checkpoints/best.pth" /></label>
        <button id="btn_load_checkpoint">加载 checkpoint</button>
        <span id="checkpoint_info"></span>
      </div>

      <div class="row">
        <label>原始帧 (frame): <input type="range" id="frame_slider" min="0" max="100" value="0" /></label>
        <span id="frame_idx">0</span>
        <button id="btn_request_frame">取该帧数据</button>
      </div>

      <div class="row">
        <label>模拟步数: <input id="roll_steps" type="number" value="12" /></label>
        <label>sample_num: <input id="sample_num" type="number" value="1" /></label>
        <label>future_5s_speed: <input id="future_5s_speed" type="number" step="0.1" /></label>
        <button id="btn_start_sim">开始模拟（从当前帧）</button>
        <button id="btn_stop_sim">停止模拟</button>
      </div>
    </section>

    <section id="canvas_area">
      <canvas id="map_canvas" width="800" height="600"></canvas>
      <div id="legend">
        <div><span class="dot ped"></span> 行人 (真实)</div>
        <div><span class="dot veh"></span> 车辆 (真实)</div>
        <div><span class="dot sim"></span> 模型预测</div>
      </div>
    </section>

    <section id="sim_controls">
      <div>模拟滑条（每次新模拟生成新的滑条）：</div>
      <div id="sim_sliders_container"></div>
      <div>说明：点击某个 agent 可查看完整轨迹并高亮；在地图上单击可设置 destination（按住 Shift 可拖动设置）</div>
    </section>

    <footer>
      <small>Backend WebSocket status: <span id="ws_status">disconnected</span></small>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
