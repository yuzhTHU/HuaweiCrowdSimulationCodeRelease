<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="connect-src *;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行人模拟可视化</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.24.2.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <header>
    <h2 class="m-0">行人模拟可视化</h2>
  </header>

  <div class="main-container">
    <!-- 左侧控制区 -->
    <aside id="sidebar">
      <div id="firefoxWarning" class="alert alert-warning d-none" role="alert">
        检测到您使用的是 Firefox 浏览器，WebSocket 功能可能无法正常使用，请换用 Chrome 或 Edge。
      </div>

      <div class="control-row">
        <label class="form-label mb-0">模型:</label>
        <select id="modelSelect" class="form-select"></select>
        <button class="btn btn-success px-3" id="loadModelBtn">加载</button>
      </div>

      <div class="control-row">
        <label class="form-label mb-0">数据:</label>
        <select id="datasetSelect" class="form-select"></select>
        <button class="btn btn-success px-3" id="loadDatasetBtn">加载</button>
      </div>

      <div class="control-row">
        <label class="form-label mb-0" style="min-width: 60px;">拖尾(s):</label>
        <input type="range" class="form-range" id="trailSlider" min="0" max="10" step="0.5" value="2.0">
        <span id="trailValue" style="min-width: 30px; text-align: right;">2.0</span>
      </div>

      <div class="control-row">
        <label class="form-label mb-0" style="min-width: 60px;">模拟时长(s):</label>
        <input type="range" class="form-range" id="simDurationSlider" min="0" max="60" step="1" value="4.8">
        <span id="simDurationValue" style="min-width: 30px; text-align: right;">4.8</span>
      </div>

      <div class="control-row">
        <label class="form-label mb-0" style="min-width: 60px;">播放速度:</label>
        <input type="range" class="form-range" id="playbackSpeedSlider" min="0.25" max="5.0" step="0.25" value="1.0">
        <span id="playbackSpeedValue" style="min-width: 30px; text-align: right;">1.0</span>
      </div>

      <div class="form-check form-switch mb-3" style="padding-left: 2.5em;">
        <input class="form-check-input" type="checkbox" id="autoViewCheckbox" checked>
        <label class="form-check-label" for="autoViewCheckbox">自动缩放</label>
      </div>

      <div class="form-check form-switch mb-2" style="padding-left: 2.5em;">
        <input class="form-check-input" type="checkbox" id="loopCheckbox">
        <label class="form-check-label" for="loopCheckbox">循环播放</label>
      </div>

      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-outline-secondary btn-sm d-none" id="editParamsBtn" type="button" data-bs-toggle="collapse" data-bs-target="#paramsCollapse" aria-expanded="false" aria-controls="paramsCollapse">
          编辑参数
        </button>
      </div>

      <div class="collapse mb-3" id="paramsCollapse">
        <div class="card card-body p-2 bg-light">
          <div id="paramsList" style="max-height: 300px; overflow-y: auto; overflow-x: hidden; font-size: 0.85rem;">
            </div>
          <div class="d-grid mt-2">
            <button class="btn btn-primary btn-sm" id="saveParamsBtn">保存参数</button>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mb-3">
        <button class="btn btn-success flex-grow-1" id="playPauseBtn">播放</button>
        <button class="btn btn-primary flex-grow-1" id="startSimBtn">开始模拟</button>
        <button class="btn btn-danger flex-grow-1" id="stopSimBtn">停止模拟</button>
      </div>

      <div id="sliders" class="slider-container"></div>
    </aside>

    <!-- 右侧显示区 -->
    <section id="display">
      <div id="map"></div>
      <pre id="log"></pre>
    </section>
  </div>

  <div id="contextMenu" class="custom-context-menu">
    <div class="custom-context-menu-item" id="ctxSaveTraj">保存轨迹</div>
  </div>

  <div class="modal fade" id="saveTrajModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">保存轨迹 - <span id="saveModalDatasetName"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">请选择保存的起始和结束帧。调整滑块时右侧视图将同步更新。</p>
          
          <div class="mb-4">
            <label class="form-label d-flex justify-content-between">
              <span>帧范围选择</span>
              <span id="saveFrameRangeVal" class="fw-bold">0 - 100</span>
            </label>
            <div class="range-slider-container">
              <div class="range-track"></div>
              <input type="range" class="range-min" id="saveRangeMin" min="0" max="100" value="0">
              <input type="range" class="range-max" id="saveRangeMax" min="0" max="100" value="100">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">保存位置</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="saveDest" id="destServer" value="server" checked>
                <label class="form-check-label" for="destServer">保存到服务器 (Logs)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="saveDest" id="destLocal" value="local">
                <label class="form-check-label" for="destLocal">下载到本地</label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="saveCompress" checked>
              <label class="form-check-label" for="saveCompress">压缩 (.csv.tz)</label>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="confirmSaveTrajBtn">确定</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
  <script>
    if (navigator.userAgent.toLowerCase().includes('firefox')) {
      document.getElementById('firefoxWarning').classList.remove('d-none');
    }
  </script>
</body>
</html>
